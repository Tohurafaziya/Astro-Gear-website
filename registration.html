<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceOutpost - Registration</title>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body>
    <header>
    
        <h1>SPACE OUTPOST</h1>
       <nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        
    </ul>
</nav>

    </header>
        <main>
            <h2>Create Your Space Outpost Account</h2>
            <p>Join our community of space explorers!</p>
             <form action="#" method="post">
                <P>
                     <label for="username">Username:</label>
                    <input
                    type="text"
                    id="username"
                    name="username"
                    required
                     >

                </P>
            
                <p>
                    <label for="password">Password:</label>
                    <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    >
                </p>

                 <p>
                
                    <label for="confirmPassword">Confirm Password:</label>
                
                    <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    required
                    >
                </p>

             <button type="submit">Create Account</button>
            </form>
             <p>Already have an account?</p>
            <nav>
    <ul>
        <li><a href="login.html">Cancel and Return to Login!</a></li>
        
    </ul>
</nav>
        </main>
   
    
</body>
</html>
